# Baut bei jedem Git-Tag (z. B. v0.3.0) das Paket und laedt es zu CurseForge hoch.
# Benoetigt das Repository-Secret CF_API_KEY (CurseForge -> Profil -> API Tokens)
# und die Zeile "## X-Curse-Project-ID: <ID>" in Friendsmith.toc.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
